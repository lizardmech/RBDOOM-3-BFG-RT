// Unified PT feature-complete production baseline.
// This is intentionally self-contained against stale diagnostic console state.

r_pathTracingUnifiedPtEnable 0
r_pathTracingUnifiedPtTemporal 0
r_pathTracingUnifiedPtSpatial 0

// Accepted Vulkan UPT D0 configuration.
r_pathTracingUnifiedPtBackend 0
r_pathTracingUnifiedPtFamily 0
r_pathTracingUnifiedPtProofStage 9
r_pathTracingUnifiedPtShaderProof 6
r_pathTracingUnifiedPtResolve 1
r_pathTracingUnifiedPtResolveView 0
r_pathTracingUnifiedPtLeanPrimary 1
r_pathTracingUnifiedPtCompactReceiver 2
r_pathTracingUnifiedPtCompactGeometry 0
r_pathTracingUnifiedPtCompactLights 1
r_pathTracingUnifiedPtCompactMaterials 0
r_pathTracingUnifiedPtSplitInitial 1
r_pathTracingUnifiedPtSplitContinuation 0
r_pathTracingUnifiedPtLightTiles 0
r_pathTracingUnifiedPtLambertDiagnostic 0
r_pathTracingUnifiedPtFrozenScene 0
r_pathTracingUnifiedPtRemoveAlphaClipSurfaces 0
r_pathTracingUnifiedPtDirectProposalParity 1
r_pathTracingUnifiedPtD0PreviousBest 1
r_pathTracingUnifiedPtDirectTargetPdfParity 1
r_pathTracingUnifiedPtAnalyticPortalDomain 1

// Accepted unified DI/GI temporal estimator and bounded replay compaction.
r_pathTracingUnifiedPtTemporalSearch 2
r_pathTracingUnifiedPtTemporalMaxHistoryM 32
r_pathTracingUnifiedPtTemporalMaxAge 32
r_pathTracingUnifiedPtTemporalPreviousBest 0
r_pathTracingUnifiedPtTemporalPairwise 1
r_pathTracingUnifiedPtTemporalIndirect 1
r_pathTracingUnifiedPtSharedReuseAdapter 1
r_pathTracingUnifiedPtCommonGrisMerge 1
r_pathTracingUnifiedPtTemporalReplayCompaction 1
r_pathTracingUnifiedPtTemporalBoilingFilter 1
r_pathTracingUnifiedPtTemporalBoilingFilterStrength 0.2
r_pathTracingUnifiedPtDuplication 1

// Accepted UPT-33 full-occupancy paired spatial and empty-center rescue.
r_pathTracingUnifiedPtSharedSpatial 1
r_pathTracingUnifiedPtSpatialStoredSourceTarget 1
r_pathTracingUnifiedPtSpatialWorkgroupPairing 1
r_pathTracingUnifiedPtSpatialEmptyRescue 1
r_pathTracingUnifiedPtSpatialMultiNeighbor 0

// Optional/rejected experimental routes stay explicitly disabled.
r_pathTracingUnifiedPtThreeVertexInitial 0
r_pathTracingUnifiedPtThreeVertexContinueProbability 0.8
r_pathTracingUnifiedPtThreeVertexMinimumPathThroughput 0.1
r_pathTracingUnifiedPtTemporalPermutationSampling 1
r_pathTracingUnifiedPtTemporalEarlyReconnect 0
r_pathTracingUnifiedPtSpatialDisocclusionBoost 0
r_pathTracingUnifiedPtSpatialDisocclusionBoostSamples 8
r_pathTracingUnifiedPtSpatialReuseTexture 1
r_pathTracingUnifiedPtSpatialShiftPrepass 1

// Diagnostics never leak into the production preset.
r_pathTracingUnifiedPtTemporalReplayCompactionDiagnostics 0
r_pathTracingUnifiedPtTemporalReconnectDiagnostics 0
r_pathTracingUnifiedPtTemporalRouteDiagnostics 0
r_pathTracingUnifiedPtTemporalBottleneckProbe 0
r_pathTracingUnifiedPtTemporalGpuTiming 0
r_pathTracingUnifiedPtSpatialDisocclusionBoostDiagnostics 0
r_pathTracingUnifiedPtSpatialGpuTiming 0
r_pathTracingUnifiedPtSpatialProofMode 0
r_pathTracingUnifiedPtDiagnostics 0
r_pathTracingUnifiedPtFixedSampleIndex -1

echo UPT production: compacted temporal, permutation, boiling filter, split Gaussian spatial
r_pathTracingUnifiedPtEnable 1
wait 1
r_pathTracingUnifiedPtTemporal 1
r_pathTracingUnifiedPtSpatial 1
