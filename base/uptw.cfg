// D0b Blob W capture preset (G-P2). Self-contained vs a prior exec upt.
// 2-vtx compact classify, temporal/spatial off, compact default not flipped
// in the binary — this file turns the cvar on for the session.
exec upt
r_pathTracingUnifiedPtTemporal 0
r_pathTracingUnifiedPtSpatial 0
r_pathTracingUnifiedPtThreeVertexInitial 0
r_pathTracingUnifiedPtThreeVertexSplit 0
r_pathTracingUnifiedPtGeometryNoSkinned 0
r_pathTracingUnifiedPtEmissiveCompact 1
echo UPT W: 2-vtx classify compact=1 T/S off. Confirm split-indirect blobBytes=304180 threeVertex=0 emissiveCompact=1 queuePolicy=sparse-mesh temporalOff=1